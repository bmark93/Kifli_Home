# Render.com Blueprint (ingyenes teszthez vagy $7/hó tartós disk-kel)
services:
  - type: web
    name: kifli-otthon
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8085"
      - key: AUTH_REQUIRED
        value: "true"
      - key: DEMO_MODE_ENABLED
        value: "true"
      - key: DEMO_DAILY_AI_LIMIT
        value: "8"
      - key: TIMEZONE
        value: "Europe/Budapest"
      - key: GEMINI_API_KEY
        sync: false
      - key: INVITE_CODE
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
